appId: com.lensquery.desktop.electron-preview
productName: What is it
copyright: Copyright What is it contributors
directories:
  output: release-electron
files:
  - dist/**
  - electron/**
  - LICENSE
  - THIRD_PARTY_NOTICES.md
  - package.json
protocols:
  - name: What is it Recognition
    schemes:
      - lensquery
extraResources:
  - from: src-tauri/icons
    to: icons
  - from: browser-extension
    to: browser-extension
asar: true
compression: maximum
mac:
  category: public.app-category.productivity
  icon: src-tauri/icons/icon.icns
  target:
    - dmg
    - dir
  extraResources:
    - from: src-tauri/target/release/lensquery
      to: sidecar/lensquery-core
  extraFiles:
    - from: build-native/macos/LensQuery Finder.appex
      to: PlugIns/LensQuery Finder.appex
  hardenedRuntime: false
  gatekeeperAssess: false
  identity: null
  extendInfo:
    LSUIElement: false
    NSAudioCaptureUsageDescription: What is it reads system audio only when the user explicitly analyzes a video or audio source.
    NSLocalNetworkUsageDescription: What is it connects only to local AI and CLI gateways that you configure.
    NSMicrophoneUsageDescription: What is it uses audio only when the user explicitly analyzes media.
    NSScreenCaptureUsageDescription: What is it captures only the region the user explicitly confirms.
    CFBundleDisplayName: What is it
    CFBundleName: What is it
win:
  icon: src-tauri/icons/icon.ico
  target:
    - nsis
  extraResources:
    - from: src-tauri/target/release/lensquery.exe
      to: sidecar/lensquery-core.exe
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false
  createStartMenuShortcut: true
